name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin.techcruncher.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: admin.techcruncher.com/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Check backend JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            if grep -Eq '^[[:space:]]*(import|export)[[:space:]]' "$file"; then
              node --input-type=module --check < "$file"
            else
              node --check "$file"
            fi
          done < <(find . -path './node_modules' -prune -o -type f -name '*.js' -print0)

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Lint, typecheck and build frontend when present
        shell: bash
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          set -euo pipefail
          # The Next.js rewrite lives beside the legacy Vite app until it replaces it.
          dir=""
          for candidate in techcruncher.com-next techcruncher.com; do
            if [[ -f "$candidate/package.json" ]]; then dir="$candidate"; break; fi
          done
          if [[ -z "$dir" ]]; then
            echo "Frontend is not present yet; skipping frontend build."
            exit 0
          fi

          cd "$dir"
          npm ci
          if npm run | grep -q "^  lint$"; then npm run lint; fi
          if npm run | grep -q "^  typecheck$"; then npm run typecheck; fi
          npm run build
